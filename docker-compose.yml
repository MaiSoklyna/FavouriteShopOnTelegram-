version: "3.8"

services:
  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Telegram Bot (separate process) ─────────────────────────
  bot:
    build: ./backend
    command: ["python", "-m", "bot.main"]
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # ── Next.js Frontend ────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_BOT_USERNAME=${BOT_USERNAME:-FavouriteOfShop_bot}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
